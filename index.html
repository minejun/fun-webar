<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ARで知る 公立はこだて未来大学</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    body {margin:0;font-family:system-ui,sans-serif;overflow:hidden;background:#111}
    #header {position:fixed;top:0;left:0;right:0;z-index:10;background:#000c;color:white;padding:12px;text-align:center;font-size:14px}
    #panel {position:fixed;bottom:15px;left:12px;right:12px;z-index:10;background:#fffffff2;border-radius:12px;padding:15px;max-width:560px;margin:auto}
    h2 {font-size:18px;margin:6px 0}
    p {font-size:14px;line-height:1.6;margin:5px 0}
    #status {font-weight:bold;color:#075c89}
    #nav {display:flex;gap:10px;margin-top:12px}
    button {flex:1;padding:12px;background:#075c89;color:white;border:0;border-radius:8px;font-size:15px}
    button:disabled {background:#bbb}
  </style>
</head>
<body>
  <div id="header">公立はこだて未来大学の歴史｜Hiroマーカーにカメラを向けてください</div>

  <div id="panel">
    <p id="status">マーカーを探しています…</p>
    <h2 id="history-title">2000年：開学</h2>
    <p id="history-text"></p>
    <p id="step"></p>
    <div id="nav">
      <button id="prev">前へ</button>
      <button id="next">次へ</button>
    </div>
  </div>

  <a-scene embedded vr-mode-ui="enabled:false"
    renderer="logarithmicDepthBuffer:true;precision:medium"
    arjs="sourceType:webcam;debugUIEnabled:false;trackingMethod:best;">

    <a-marker preset="hiro" id="hiro">
      <a-box position="0 0.5 0"
        material="color:#18a6c8;opacity:.9"
        rotation="0 35 0"
        animation="property:rotation;to:0 395 0;loop:true;dur:9000;easing:linear">
      </a-box>
      <a-text value="FUN AR" position="-0.7 1.35 0"
        scale="1.5 1.5 1.5" color="#ffffff"
        align="center" side="double">
      </a-text>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.querySelector('#hiro');
    const status = document.querySelector('#status');

    marker.addEventListener('markerFound', () => {
      status.textContent = 'AR表示中！';
    });
    marker.addEventListener('markerLost', () => {
      status.textContent = 'マーカーを探しています…';
    });

    const pages = [
      {
        title: '2000年：開学',
        text: '公立はこだて未来大学は2000年に開学しました。情報科学とデザインを横断する学びを特色とする大学です。'
      },
      {
        title: '大学の発展',
        text: '未来大学では、情報技術を基盤に、デザインや人間・社会との関わりを考える教育・研究が行われてきました。'
      },
      {
        title: '現在の未来大学',
        text: '現在も、情報科学とデザインを結びつけ、課題を発見し解決する学びを大切にしています。'
      }
    ];

    let current = 0;
    const title = document.querySelector('#history-title');
    const description = document.querySelector('#history-text');
    const step = document.querySelector('#step');
    const prev = document.querySelector('#prev');
    const next = document.querySelector('#next');

    function render() {
      title.textContent = pages[current].title;
      description.textContent = pages[current].text;
      step.textContent = `${current + 1} / ${pages.length}`;
      prev.disabled = current === 0;
      next.disabled = current === pages.length - 1;
    }

    prev.addEventListener('click', () => {
      if (current > 0) {
        current--;
        render();
      }
    });
    next.addEventListener('click', () => {
      if (current < pages.length - 1) {
        current++;
        render();
      }
    });

    render();
  </script>
</body>
</html>
