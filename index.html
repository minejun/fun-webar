<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>未来大の歴史AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 10px;
      right: 10px;
      z-index: 9999;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 15px;
      text-align: center;
      border-radius: 10px;
    }

    #message {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 5%;
      width: 90%;
      box-sizing: border-box;
      z-index: 9999;
      background: white;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 15px #0005;
    }

    h2 {
      color: #075c89;
      font-size: 20px;
    }

    p {
      font-size: 15px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <div id="status">
    マーカーにカメラを向けてください
  </div>

  <div id="message">
    <h2>公立はこだて未来大学の歴史</h2>
    <p>
      公立はこだて未来大学は、
      2000年に開学しました。<br>
      情報科学とデザインを融合した
      教育・研究を行っています。
    </p>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
   arjs="sourceType: webcam; debugUIEnabled: true;"

    <a-assets timeout="10000">
      <img id="mirai-photo" src="./mirai2000.png">
    </a-assets>

   <a-marker
  id="marker"
  type="pattern"
  url="./mirai-blue.patt"
  emitevents="true">

      <!-- 写真をマーカーの上に表示 -->
      <a-image
  src="#mirai-photo"
  position="0 0.3 0"
  rotation="-90 0 0"
  width="0.9"
  height="0.6"
  material="side: double">
</a-image>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const marker = document.querySelector("#marker");
    const status = document.querySelector("#status");
    const message = document.querySelector("#message");

    marker.addEventListener("markerFound", () => {
      status.textContent = "マーカー認識成功！";
      status.style.background = "green";
      message.style.display = "block";
    });

    marker.addEventListener("markerLost", () => {
      status.textContent =
        "マーカーにカメラを向けてください";
      status.style.background = "rgba(0,0,0,0.8)";
      message.style.display = "none";
    });
  </script>

</body>
</html>
