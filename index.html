<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ARで知る 公立はこだて未来大学</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    body {margin:0;font-family:system-ui,sans-serif;overflow:hidden;background:#111}
    #header {position:fixed;top:0;left:0;right:0;z-index:10;background:rgba(0,0,0,.75);color:white;padding:12px 14px;text-align:center;font-size:14px}
    #panel {position:fixed;bottom:14px;left:12px;right:12px;z-index:10;background:rgba(255,255,255,.94);border-radius:12px;padding:14px;max-width:560px;margin:auto;box-shadow:0 3px 14px #0004}
    #panel h2 {font-size:17px;margin:0 0 6px} #panel p {font-size:13px;line-height:1.55;margin:0} #status {font-weight:bold;color:#075c89;margin-bottom:5px!important}
  </style>
</head>
<body>
  <div id="header">公立はこだて未来大学の歴史｜Hiroマーカーにカメラを向けてください</div>
  <div id="panel" role="status"><p id="status">マーカーを探しています…</p><h2>ARで知る、未来大学の歩み</h2><p>マーカーを認識すると、3Dオブジェクトが現れます。歴史の説明は大学の公式資料で確認して追加してください。</p></div>
  <a-scene embedded vr-mode-ui="enabled:false" renderer="logarithmicDepthBuffer:true;precision:medium" arjs="sourceType:webcam;debugUIEnabled:false;trackingMethod:best;">
    <a-marker preset="hiro" id="hiro">
      <a-box position="0 0.5 0" material="color:#18a6c8;opacity:.9" rotation="0 35 0" animation="property:rotation;to:0 395 0;loop:true;dur:9000;easing:linear"></a-box>
      <a-text value="FUN AR" position="-0.7 1.35 0" scale="1.5 1.5 1.5" color="#ffffff" align="center" side="double"></a-text>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
  <script>
    const marker=document.querySelector('#hiro');
    const status=document.querySelector('#status');
    marker.addEventListener('markerFound',()=>{status.textContent='AR表示中！';});
    marker.addEventListener('markerLost',()=>{status.textContent='マーカーを探しています…';});
  </script>
</body>
</html>
